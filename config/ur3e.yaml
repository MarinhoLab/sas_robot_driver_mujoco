# A UR3e in a MuJoCo scene, e.g., the scene of cpp-interface-mujoco-robots:
#   <cpp-interface-mujoco-robots>/models/universal_robots_ur3e/scene.xml
# The scene is given to the launch file (model_path:=<scene.xml>).
/**:
  ros__parameters:
    robot_joint_names: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint",
                        "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]
    home_keyframe: "home"
    joint_limits_min: [-360.0, -360.0, -180.0, -360.0, -360.0, -360.0]  # degrees, the joint ranges of the model
    joint_limits_max: [360.0, 360.0, 180.0, 360.0, 360.0, 360.0]
    thread_sampling_time_sec: 0.002  # 500 Hz
    headless: false
    gui: false       # the GUI of the window (the launch argument gui:=true overrides it)
    window_width: 1920   # screen coordinates
    window_height: 1080

    # Reference frames, drawn in the scene (no physics), each with a sas::ObjectServer:
    # /<node name>/<frame>/get/pose (published every reference_frames_publish_period) and
    # /<node name>/<frame>/set/pose (moves the frame). Remove reference_frame_names to have none.
    # Both start at the pose of the end effector at home (the flange, pointing down).
    reference_frame_names: ["x_desired", "x"]
    reference_frames_publish_period: 0.01  # seconds (100 Hz)
    reference_frames:
      x_desired:  # e.g., the desired pose of the end effector
        initial_pose: [0.2985, 0.131, 0.3033, 0.0, 0.7071, 0.7071, 0.0]  # x, y, z, qw, qx, qy, qz (in the world)
        axis_length: 0.1   # optional, meters (default 0.1)
        axis_width: 0.005  # optional, meters (default 0.005)
        opacity: 0.5       # optional, from 0 to 1 (default 1)
        show_label: true   # optional (default true)
      x:  # e.g., the pose of the end effector
        initial_pose: [0.2985, 0.131, 0.3033, 0.0, 0.7071, 0.7071, 0.0]
        opacity: 1.0
