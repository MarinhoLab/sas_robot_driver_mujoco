# sas_robot_driver_mujoco in a container, with the image of docker/Dockerfile.
#   ur3e:  a UR3e (config/ur3e.yaml), with the window of the scene.
#   z1:    a Unitree Z1 (config/z1.yaml), with the window of the scene.
#   scene: any scene of the host (an MJCF file in SCENE_DIR, see .env), e.g., the UMIRobot of models/umirobot.
# All talk through ROS 2 on the host network: the topics are /<name>/... (e.g., ros2 topic echo
# /ur3e/get/joint_states, from the host or from another container).
#
# From this folder (xhost +local:root if the X server refuses the connection):
#   docker compose up --build ur3e
#   docker compose up --build z1
#   docker compose up --build scene
# Without a window (e.g., on a server), add headless:=true to the command of the service.

# The settings shared by the services
x-driver: &driver
  image: sas_robot_driver_mujoco_jazzy
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &environment
    DISPLAY: $DISPLAY  # x server related
    XAUTHORITY: /root/.Xauthority  # x server related
    QT_X11_NO_MITSHM: 1  # x server related
    # ROS 2 through UDP only: the shared memory of Fast DDS fails silently between processes of different users
    # (root here, the user on the host), so the host would see the topics but not their messages.
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
  privileged: true  # Needed for some gpu configurations.
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix  # x server related
    - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro  # x server related
  network_mode: "host"
  ipc: "host"
  # No tty (and no stdin_open): with a tty, ros2 launch does not pass the SIGINT of docker stop (or of Ctrl+C on
  # docker compose up) to the driver, which would be killed after the grace period instead of stopping cleanly.
  stop_grace_period: 30s  # sigterm_timeout of the launch file.

services:
  ur3e:
    <<: *driver
    command: /bin/bash -c "
            ros2 launch sas_robot_driver_mujoco robot_launch.py name:=ur3e
            model_path:=$${MUJOCO_ROBOTS_MODELS}/universal_robots_ur3e/scene.xml"

  z1:
    <<: *driver
    command: /bin/bash -c "
            ros2 launch sas_robot_driver_mujoco robot_launch.py name:=z1
            model_path:=$${MUJOCO_ROBOTS_MODELS}/unitree_z1/scene.xml"

  # A scene of the host: SCENE_DIR (the folder of the scene, with the files it includes and its meshes) is mounted on
  # /scene, and the driver loads /scene/SCENE_FILE. The robot is named ROBOT_NAME, which is the prefix of the topics and
  # chooses its parameters (config/<ROBOT_NAME>.yaml of the package: ur3e, z1 or umirobot), unless CONFIG_FILE (a YAML
  # file in SCENE_DIR) is given. Set them in .env (the UMIRobot of models/umirobot, by default), or in the shell, e.g.:
  #   SCENE_DIR=~/my_scenes SCENE_FILE=ur3e_on_a_table.xml ROBOT_NAME=ur3e docker compose up scene
  scene:
    <<: *driver
    environment:
      <<: *environment
      CONFIG_FILE: ${CONFIG_FILE:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # x server related
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro  # x server related
      - ${SCENE_DIR:?Set SCENE_DIR to the folder of the scene (see .env)}:/scene:ro
    command: /bin/bash -c "
            ros2 launch sas_robot_driver_mujoco robot_launch.py name:=${ROBOT_NAME:-umirobot}
            model_path:=/scene/${SCENE_FILE:-scene.xml}
            $${CONFIG_FILE:+config_file:=/scene/$$CONFIG_FILE}"
